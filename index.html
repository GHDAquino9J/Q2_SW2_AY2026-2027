<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Bootstrap Forms and Navbar</title>
    <style>
        body {background-image: url(https://assets.bluprint-onemega.com/wp-content/uploads/2023/01/BP-2023-Website-Featured-Photo-OB-Montessori-scaled.jpg);
            background-size: cover;
            background-position: center;
            height: 100vh;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT2TdRDjOPFGEdDrbANdhF1kYD42gDFgOWfysL1oJpOXw&s" alt="logo" width="25">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="collapsibleNavbar">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="#">Contact Us</a>
        </li>    
      </ul>
    </div>
  </div>
</nav>
      <div class="card p-4 shadow-sm" style="max-width: 400px; width: 100%;">
  <h1>Send a Form</h1>
  <form>
    <div class="row">
      <div class="col">
        <label for="first name">First Name:</label>
        <input type="text" class="form-control" id="first name" placeholder="Enter First Name" name="First Name">
      </div>
      <div class="mb-3">
      <label for="emailAddress" class="form-label">Email Address:</label>
      <input type="email" class="form-control" id="emailAddress" placeholder="Enter your email">
    </div>


    <div class="mb-3">
      <label for="subject" class="form-label">Subject:</label>
      <input type="text" class="form-control" id="subject" placeholder="Enter subject">
    </div>
    <div class="mb-4">
      <label for="message" class="form-label">Message:</label>
      <textarea class="form-control" id="message" rows="4" placeholder="Type your message here"></textarea>
    </div>
    <button type="submit" class="btn btn-primary w-100">Submit</button>
    </div>
  </form>
  </div>

</div>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT2TdRDjOPFGEdDrbANdhF1kYD42gDFgOWfysL1oJpOXw&s" alt="logo" width="25">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="collapsibleNavbar">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="#">Home Page</a>
        </li>    
      </ul>
    </div>
     <div class="collapse navbar-collapse" id="collapsibleNavbar">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="#">About us</a>
        </li>    
      </ul>
    </div>
    
  </div>
</nav>
</body>
</html>
